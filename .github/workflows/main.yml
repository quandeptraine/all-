name: Build Farm Viet V13 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # =====================================================
      # PREPARE PROJECT
      # =====================================================

      - name: Prepare FarmViet
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FARMVIET V13"
          echo "========================================"

          test -d "FarmViet.xcodeproj"
          test -f "FarmViet.xcodeproj/project.pbxproj"

          rm -rf "FarmViet"
          mkdir -p "FarmViet"

          # -------------------------------------------------
          # Swift source
          # -------------------------------------------------

          cp -f "FarmVietApp.swift" "FarmViet/"
          cp -f "FarmView.swift" "FarmViet/"
          cp -f "GameScene.swift" "FarmViet/"
          cp -f "Info.plist" "FarmViet/"

          echo "Swift source OK"

          # =================================================
          # CREATE RESOURCE DIRECTORIES
          # =================================================

          mkdir -p "FarmViet/Resources/FarmExpansion/Farming101_Free"
          mkdir -p "FarmViet/Resources/FarmExpansion/SuperRetroRanch_FreeTier"
          mkdir -p "FarmViet/Resources/FarmExpansion/OtherFreeVersion"

          # =================================================
          # COPY EXISTING RESOURCES IF THEY EXIST
          # =================================================

          if [ -d "Resources" ]; then
            echo "Existing Resources found"
            cp -R "Resources/." "FarmViet/Resources/"
          fi

          if [ -d "Assets" ]; then
            echo "Existing Assets found"
            mkdir -p "FarmViet/Assets"
            cp -R "Assets/." "FarmViet/Assets/"
          fi

          # =================================================
          # ROOT ASSETS -> RESOURCE FOLDERS
          # =================================================

          echo ""
          echo "========================================"
          echo "REBUILDING FARM EXPANSION"
          echo "========================================"

          python3 <<'PY'
          import os
          import shutil

          root = "."
          base = "FarmViet/Resources/FarmExpansion"

          farming = os.path.join(
              base,
              "Farming101_Free"
          )

          superretro = os.path.join(
              base,
              "SuperRetroRanch_FreeTier"
          )

          other = os.path.join(
              base,
              "OtherFreeVersion"
          )

          os.makedirs(farming, exist_ok=True)
          os.makedirs(superretro, exist_ok=True)
          os.makedirs(other, exist_ok=True)

          farming_prefixes = (
              "F101_",
          )

          super_prefixes = (
              "SRR_",
          )

          copied = 0

          for name in os.listdir(root):

              path = os.path.join(root, name)

              if not os.path.isfile(path):
                  continue

              lower = name.lower()

              # ---------------------------------------------
              # Farming 101
              # ---------------------------------------------

              if name.startswith(farming_prefixes):

                  target = os.path.join(
                      farming,
                      name
                  )

                  shutil.copy2(
                      path,
                      target
                  )

                  print(
                      "Farming101:",
                      name
                  )

                  copied += 1

              # ---------------------------------------------
              # Super Retro Ranch
              # ---------------------------------------------

              elif name.startswith(super_prefixes):

                  # Never copy premium preview assets.
                  if "premium" in lower:
                      print(
                          "SKIP PREMIUM:",
                          name
                      )
                      continue

                  target = os.path.join(
                      superretro,
                      name
                  )

                  shutil.copy2(
                      path,
                      target
                  )

                  print(
                      "SuperRetroRanch:",
                      name
                  )

                  copied += 1

              # ---------------------------------------------
              # Free version
              # ---------------------------------------------

              elif name == "FREE_free.png":

                  target = os.path.join(
                      other,
                      name
                  )

                  shutil.copy2(
                      path,
                      target
                  )

                  print(
                      "OtherFreeVersion:",
                      name
                  )

                  copied += 1

          print("")
          print(
              "Expansion assets reconstructed:",
              copied
          )
          PY

          # =================================================
          # COPY ORIGINAL FARM PIXEL ASSETS
          # =================================================

          python3 <<'PY'
          import os
          import shutil

          destination = "FarmViet"

          extensions = {
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".wav",
              ".mp3",
              ".m4a"
          }

          special_prefixes = (
              "F101_",
              "SRR_"
          )

          for name in os.listdir("."):

              path = os.path.join(".", name)

              if not os.path.isfile(path):
                  continue

              ext = os.path.splitext(name)[1].lower()

              if ext not in extensions:
                  continue

              # Expansion assets go into their proper folders.
              if name.startswith(special_prefixes):
                  continue

              if name == "FREE_free.png":
                  continue

              target = os.path.join(
                  destination,
                  name
              )

              shutil.copy2(
                  path,
                  target
              )

              print(
                  "Farm asset:",
                  name
              )
          PY

          # =================================================
          # WATER / PIER ALIASES
          # =================================================

          if [ ! -f "FarmViet/WaterTile.png" ]; then
            if [ -f "FarmViet/Water.png" ]; then
              cp -f \
                "FarmViet/Water.png" \
                "FarmViet/WaterTile.png"
              echo "Created WaterTile.png"
            fi
          fi

          if [ ! -f "FarmViet/PierTile.png" ]; then
            if [ -f "FarmViet/Pier_Tiles.png" ]; then
              cp -f \
                "FarmViet/Pier_Tiles.png" \
                "FarmViet/PierTile.png"
              echo "Created PierTile.png"
            fi
          fi

          # =================================================
          # FISHERMAN FRAME ALIASES
          # =================================================

          python3 <<'PY'
          import os
          import shutil

          directory = "FarmViet"

          bases = [
              "Fisherman_idle",
              "Fisherman_walk",
              "Fisherman_row",
              "Fisherman_fish",
              "Fisherman_hook"
          ]

          for base in bases:

              source = os.path.join(
                  directory,
                  base + ".png"
              )

              if not os.path.isfile(source):
                  continue

              for number in range(0, 21):

                  target = os.path.join(
                      directory,
                      f"{base}_{number}.png"
                  )

                  if not os.path.isfile(target):

                      shutil.copy2(
                          source,
                          target
                      )

                      print(
                          "Frame alias:",
                          os.path.basename(target)
                      )
          PY

          # =================================================
          # VERIFY EXPANSION
          # =================================================

          echo ""
          echo "========================================"
          echo "FARM EXPANSION CHECK"
          echo "========================================"

          test -d \
            "FarmViet/Resources/FarmExpansion"

          test -d \
            "FarmViet/Resources/FarmExpansion/Farming101_Free"

          test -d \
            "FarmViet/Resources/FarmExpansion/SuperRetroRanch_FreeTier"

          echo ""
          echo "Farming 101:"
          find \
            "FarmViet/Resources/FarmExpansion/Farming101_Free" \
            -type f \
            | sort

          echo ""
          echo "SuperRetroRanch:"
          find \
            "FarmViet/Resources/FarmExpansion/SuperRetroRanch_FreeTier" \
            -type f \
            | sort

          echo ""
          echo "Other free:"
          find \
            "FarmViet/Resources/FarmExpansion/OtherFreeVersion" \
            -type f \
            | sort

          echo ""
          echo "========================================"
          echo "PREPARE COMPLETE"
          echo "========================================"

      # =====================================================
      # XCODE
      # =====================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select \
            -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

          xcrun \
            --sdk iphoneos \
            --show-sdk-path

      # =====================================================
      # INSPECT PROJECT
      # =====================================================

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -e

          xcodebuild \
            -project "FarmViet.xcodeproj" \
            -list

      # =====================================================
      # BUILD
      # =====================================================

      - name: Build Farm Viet
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD FARM VIET V13"
          echo "========================================"

          rm -rf "build"

          mkdir -p "build"

          xcodebuild \
            -project "FarmViet.xcodeproj" \
            -scheme "FarmViet" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -derivedDataPath "build/DerivedData" \
            SDKROOT=iphoneos \
            SUPPORTED_PLATFORMS=iphoneos \
            TARGETED_DEVICE_FAMILY="1,2" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            SUPPORTS_MACCATALYST=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "build/xcodebuild.log"

      # =====================================================
      # ERROR LOG
      # =====================================================

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "BUILD FAILED"
          echo "========================================"

          if [ -f "build/xcodebuild.log" ]; then

            grep -n -E \
              "error:|fatal error|BUILD FAILED|cannot be found|not found" \
              "build/xcodebuild.log" \
              || true

            echo ""
            echo "LAST 300 LINES"
            echo "----------------------------------------"

            tail -n 300 \
              "build/xcodebuild.log"

          fi

      # =====================================================
      # FIND APP
      # =====================================================

      - name: Find FarmViet app
        shell: bash
        run: |
          set -e

          APP=$(find \
            "build/DerivedData" \
            -type d \
            -name "FarmViet.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: FarmViet.app not found"
            exit 1
          fi

          echo "APP FOUND:"
          echo "$APP"

      # =====================================================
      # CREATE IPA
      # =====================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          APP=$(find \
            "build/DerivedData" \
            -type d \
            -name "FarmViet.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: FarmViet.app not found"
            exit 1
          fi

          rm -rf "build/Payload"

          mkdir -p "build/Payload"

          cp -R \
            "$APP" \
            "build/Payload/FarmViet.app"

          cd "build"

          zip -r \
            "FarmViet-V13-unsigned.ipa" \
            "Payload"

          echo ""
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh \
            "FarmViet-V13-unsigned.ipa"

      # =====================================================
      # UPLOAD IPA
      # =====================================================

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V13-unsigned-IPA
          path: build/FarmViet-V13-unsigned.ipa
          if-no-files-found: error

      # =====================================================
      # UPLOAD LOG
      # =====================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V13-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
