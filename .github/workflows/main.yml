name: Build Farm Viet V13 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # =====================================================
      # PREPARE
      # =====================================================

      - name: Prepare FarmViet
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FARMVIET V13"
          echo "========================================"

          test -d "FarmViet.xcodeproj"
          test -f "FarmViet.xcodeproj/project.pbxproj"

          rm -rf "FarmViet"
          mkdir -p "FarmViet"

          # -------------------------------------------------
          # Swift
          # -------------------------------------------------

          cp -f "FarmVietApp.swift" "FarmViet/"
          cp -f "FarmView.swift" "FarmViet/"
          cp -f "GameScene.swift" "FarmViet/"
          cp -f "Info.plist" "FarmViet/"

          echo "Swift source copied"

          # =================================================
          # COPY EVERY RESOURCE REFERENCED BY PBXPROJ
          # =================================================

          echo ""
          echo "========================================"
          echo "RESOLVING XCODE ASSETS"
          echo "========================================"

          python3 <<'PY'
          import os
          import re
          import shutil

          project = "FarmViet.xcodeproj/project.pbxproj"
          destination_root = "FarmViet"

          with open(
              project,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              text = f.read()

          # -------------------------------------------------
          # Find all resource paths/names referenced by Xcode
          # -------------------------------------------------

          references = set()

          patterns = [
              r'path\s*=\s*([^;]+);',
              r'name\s*=\s*([^;]+);',
              r'([A-Za-z0-9_./ -]+\.(?:png|jpg|jpeg|gif|wav|mp3|m4a))'
          ]

          for pattern in patterns:

              for value in re.findall(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              ):

                  value = value.strip().strip('"')
                  value = value.replace("\\", "/")

                  filename = os.path.basename(value)

                  if not filename:
                      continue

                  ext = os.path.splitext(
                      filename
                  )[1].lower()

                  if ext in {
                      ".png",
                      ".jpg",
                      ".jpeg",
                      ".gif",
                      ".wav",
                      ".mp3",
                      ".m4a"
                  }:
                      references.add(value)

          print(
              "Xcode resource references:",
              len(references)
          )

          # -------------------------------------------------
          # Build complete repo file index
          # -------------------------------------------------

          repo_files = []

          for root, dirs, files in os.walk("."):

              # Ignore git/build/generated folders
              dirs[:] = [
                  d for d in dirs
                  if d not in {
                      ".git",
                      "FarmViet",
                      "build",
                      "DerivedData"
                  }
              ]

              for filename in files:

                  path = os.path.join(
                      root,
                      filename
                  )

                  repo_files.append(path)

          print(
              "Repository files indexed:",
              len(repo_files)
          )

          # -------------------------------------------------
          # Lookup by basename
          # -------------------------------------------------

          by_name = {}

          for path in repo_files:

              filename = os.path.basename(path)

              by_name.setdefault(
                  filename.lower(),
                  []
              ).append(path)

          copied = 0
          missing = []

          # -------------------------------------------------
          # Copy every referenced resource
          # -------------------------------------------------

          for reference in sorted(references):

              reference = reference.replace(
                  "\\",
                  "/"
              )

              filename = os.path.basename(
                  reference
              )

              # Don't process system/project files
              if filename in {
                  "Info.plist"
              }:
                  continue

              matches = by_name.get(
                  filename.lower(),
                  []
              )

              if not matches:

                  # Try normalized comparison
                  normalized = re.sub(
                      r"[^a-z0-9]",
                      "",
                      filename.lower()
                  )

                  for candidate in repo_files:

                      candidate_name = os.path.basename(
                          candidate
                      )

                      candidate_normalized = re.sub(
                          r"[^a-z0-9]",
                          "",
                          candidate_name.lower()
                      )

                      if candidate_normalized == normalized:

                          matches.append(
                              candidate
                          )

              if not matches:

                  missing.append(
                      reference
                  )

                  continue

              source = matches[0]

              # Preserve the exact path requested
              # by the Xcode project.
              target = os.path.join(
                  destination_root,
                  reference
              )

              os.makedirs(
                  os.path.dirname(target),
                  exist_ok=True
              )

              shutil.copy2(
                  source,
                  target
              )

              print(
                  "COPIED:",
                  reference
              )

              print(
                  "   FROM:",
                  source
              )

              copied += 1

          print("")
          print(
              "Resources copied:",
              copied
          )

          print(
              "Resources missing:",
              len(missing)
          )

          if missing:

              print("")
              print(
                  "========================================"
              )

              print(
                  "MISSING XCODE RESOURCES"
              )

              print(
                  "========================================"
              )

              for item in missing:
                  print(
                      "MISSING:",
                      item
                  )

              print("")

              # Don't fail yet.
              # Some references may be aliases generated below.

          PY

          # =================================================
          # ROOT ASSETS
          # =================================================

          python3 <<'PY'
          import os
          import shutil

          destination = "FarmViet"

          extensions = {
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".wav",
              ".mp3",
              ".m4a"
          }

          for name in os.listdir("."):

              path = os.path.join(".", name)

              if not os.path.isfile(path):
                  continue

              if os.path.splitext(name)[1].lower() not in extensions:
                  continue

              target = os.path.join(
                  destination,
                  name
              )

              if not os.path.exists(target):

                  shutil.copy2(
                      path,
                      target
                  )

                  print(
                      "ROOT ASSET:",
                      name
                  )

          PY

          # =================================================
          # KNOWN ALIASES
          # =================================================

          echo ""
          echo "========================================"
          echo "KNOWN ALIASES"
          echo "========================================"

          if [ ! -f "FarmViet/WaterTile.png" ]; then

            if [ -f "FarmViet/Water.png" ]; then

              cp -f \
                "FarmViet/Water.png" \
                "FarmViet/WaterTile.png"

              echo "Created WaterTile.png"

            fi

          fi

          if [ ! -f "FarmViet/PierTile.png" ]; then

            if [ -f "FarmViet/Pier_Tiles.png" ]; then

              cp -f \
                "FarmViet/Pier_Tiles.png" \
                "FarmViet/PierTile.png"

              echo "Created PierTile.png"

            fi

          fi

          # =================================================
          # FISHERMAN ALIASES
          # =================================================

          python3 <<'PY'
          import os
          import shutil

          directory = "FarmViet"

          bases = [
              "Fisherman_idle",
              "Fisherman_walk",
              "Fisherman_row",
              "Fisherman_fish",
              "Fisherman_hook"
          ]

          for base in bases:

              source = os.path.join(
                  directory,
                  base + ".png"
              )

              if not os.path.isfile(source):
                  continue

              for number in range(0, 21):

                  target = os.path.join(
                      directory,
                      f"{base}_{number}.png"
                  )

                  if not os.path.isfile(target):

                      shutil.copy2(
                          source,
                          target
                      )

                      print(
                          "FRAME:",
                          os.path.basename(target)
                      )

          PY

          # =================================================
          # FINAL CHECK
          # =================================================

          echo ""
          echo "========================================"
          echo "CHECK FARM EXPANSION"
          echo "========================================"

          if [ -d "FarmViet/Resources/FarmExpansion" ]; then

            find \
              "FarmViet/Resources/FarmExpansion" \
              -type f \
              | sort \
              | head -500

          else

            echo "WARNING: FarmExpansion directory missing"

          fi

          echo ""
          echo "========================================"
          echo "CHECK SPECIFIC SRR FILES"
          echo "========================================"

          find \
            "FarmViet" \
            -type f \
            -name "SRR_wheat*" \
            -print \
            | sort \
            || true

          find \
            "FarmViet" \
            -type f \
            -name "SRR_tree*" \
            -print \
            | sort \
            || true

          echo ""
          echo "PREPARE COMPLETE"

      # =====================================================
      # XCODE
      # =====================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select \
            -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

          xcrun \
            --sdk iphoneos \
            --show-sdk-path

      # =====================================================
      # PROJECT
      # =====================================================

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -e

          xcodebuild \
            -project "FarmViet.xcodeproj" \
            -list

      # =====================================================
      # BUILD
      # =====================================================

      - name: Build Farm Viet
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD FARM VIET V13"
          echo "========================================"

          rm -rf "build"

          mkdir -p "build"

          xcodebuild \
            -project "FarmViet.xcodeproj" \
            -scheme "FarmViet" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -derivedDataPath "build/DerivedData" \
            SDKROOT=iphoneos \
            SUPPORTED_PLATFORMS=iphoneos \
            TARGETED_DEVICE_FAMILY="1,2" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            SUPPORTS_MACCATALYST=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "build/xcodebuild.log"

      # =====================================================
      # ERRORS
      # =====================================================

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "BUILD FAILED"
          echo "========================================"

          if [ -f "build/xcodebuild.log" ]; then

            grep -n -E \
              "error:|fatal error|BUILD FAILED|cannot be found|not found" \
              "build/xcodebuild.log" \
              || true

            echo ""
            echo "LAST 300 LINES"
            echo "----------------------------------------"

            tail -n 300 \
              "build/xcodebuild.log"

          fi

      # =====================================================
      # APP
      # =====================================================

      - name: Find FarmViet app
        shell: bash
        run: |
          set -e

          APP=$(find \
            "build/DerivedData" \
            -type d \
            -name "FarmViet.app" \
            | head -n 1)

          if [ -z "$APP" ]; then

            echo "ERROR: FarmViet.app not found"

            exit 1

          fi

          echo "APP FOUND:"
          echo "$APP"

      # =====================================================
      # IPA
      # =====================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          APP=$(find \
            "build/DerivedData" \
            -type d \
            -name "FarmViet.app" \
            | head -n 1)

          if [ -z "$APP" ]; then

            echo "ERROR: FarmViet.app not found"

            exit 1

          fi

          rm -rf "build/Payload"

          mkdir -p "build/Payload"

          cp -R \
            "$APP" \
            "build/Payload/FarmViet.app"

          cd "build"

          zip -r \
            "FarmViet-V13-unsigned.ipa" \
            "Payload"

          ls -lh \
            "FarmViet-V13-unsigned.ipa"

      # =====================================================
      # ARTIFACT
      # =====================================================

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V13-unsigned-IPA
          path: build/FarmViet-V13-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V13-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
